<script>
  function show(id) {
    document.querySelectorAll(".page").forEach(function (page) {
      page.classList.remove("active");
    });

    var selectedPage = document.getElementById(id);

    if (selectedPage) {
      selectedPage.classList.add("active");
    }
  }

  async function testMail() {
    var emailInput = document.getElementById("to");

    if (!emailInput) {
      alert("Test email field nahi mila.");
      return;
    }

    var email = emailInput.value.trim();

    if (!email) {
      alert("Apna test email address enter karein.");
      return;
    }

    var button = event.currentTarget;
    var originalText = button.textContent;

    button.disabled = true;
    button.textContent = "Sending...";

    try {
      var response = await fetch("/api/test", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          to: email
        })
      });

      var result = await response.text();

      if (!response.ok) {
        throw new Error(result || "Test email failed");
      }

      alert("Test email Brevo ko successfully bhej diya gaya.");
    } catch (error) {
      alert("Error: " + error.message);
    } finally {
      button.disabled = false;
      button.textContent = originalText;
    }
  }
</script>
